<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AB Voleybol</title>
  <meta name="description" content="Akdeniz Bilgi S.K. voleybol takım yönetimi">
  <meta name="theme-color" content="#b5121b">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AB Voleybol">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
</head>
<body>
  <!-- Giriş ekranı -->
  <section id="login" class="login" hidden>
    <form class="login-card" id="login-form">
      <img src="logo.jpg" alt="Akdeniz Bilgi Spor Kulübü logosu" class="login-logo">
      <h1>Voleybol</h1>
      <p class="muted">Akdeniz Bilgi S.K. antrenör paneli</p>
      <label>E-posta<input type="email" name="email" autocomplete="username" required></label>
      <label>Şifre<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn btn-primary btn-block" type="submit">Giriş yap</button>
      <p class="login-err" id="login-err" role="alert"></p>
    </form>
  </section>

  <!-- Uygulama -->
  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <a class="brand" href="#/">
        <img src="logo.jpg" alt="" class="brand-logo">
        <span><b>Akdeniz Bilgi</b><small>Voleybol</small></span>
      </a>
      <nav class="nav" id="nav"></nav>
    </aside>
    <div class="main">
      <header class="topbar">
        <a class="topbar-brand" href="#/"><img src="logo.jpg" alt="" class="brand-logo"></a>
        <h2 id="page-title">Ana Sayfa</h2>
        <span class="demo-badge" id="demo-badge" hidden>DENEME MODU</span>
        <a class="icon-btn" href="#/ayarlar" aria-label="Ayarlar" title="Ayarlar">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </a>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
    <nav class="bottomnav" id="bottomnav"></nav>
  </div>

  <div id="boot" class="boot"><img src="logo.jpg" alt="" class="boot-logo"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
